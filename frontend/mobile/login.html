<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MyAccess — Sign in</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="U">

<div class="screen-group">
  <div class="screen-label">01 · Login</div>
  <div class="phone light U">
    <div class="notch"></div>
    <div class="phone-screen" style="background:var(--bg)">

      <div class="sb" style="background:var(--sf)">
        <span class="sb-time" style="color:#0D7A5F">9:41</span>
        <div class="sb-right">
          <svg width="16" height="11" viewBox="0 0 16 11" fill="#0D7A5F"><rect x="0" y="3" width="3" height="8" rx="1"/><rect x="4.5" y="2" width="3" height="9" rx="1"/><rect x="9" y="0" width="3" height="11" rx="1"/><rect x="13.5" y="1" width="2.5" height="10" rx="1" opacity=".3"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke="#0D7A5F" stroke-opacity=".35"/><rect x="2" y="2" width="16" height="8" rx="2" fill="#0D7A5F"/><path d="M23 4.5v3a1.5 1.5 0 000-3z" fill="#0D7A5F" opacity=".4"/></svg>
        </div>
      </div>

      <div class="login-logo-area-m">
        <div class="ll-icon">
          <svg width="30" height="30" viewBox="0 0 34 34" fill="none">
            <rect x="5" y="9" width="20" height="14" rx="3" fill="white"/>
            <rect x="8" y="12" width="5" height="4" rx="1" fill="#0D7A5F"/>
            <rect x="15" y="12" width="5" height="4" rx="1" fill="#0D7A5F"/>
            <circle cx="10" cy="24" r="2" fill="white"/>
            <circle cx="20" cy="24" r="2" fill="white"/>
            <line x1="4" y1="24" x2="26" y2="24" stroke="white" stroke-width="1.5" opacity=".5"/>
            <circle cx="27" cy="9" r="5" fill="white"/>
            <circle cx="27" cy="9" r="2.5" fill="#0D7A5F"/>
          </svg>
        </div>
        <div class="ll-name">MyAccess</div>
        <div class="ll-sub">Melbourne accessibility network</div>
      </div>

      <div class="login-form-m">
        <div>
          <label class="lf-label">Email address</label>
          <input class="lf-input" type="email" placeholder="you@example.com" readonly>
        </div>
        <div>
          <label class="lf-label">Password</label>
          <input class="lf-input" type="password" placeholder="••••••••" readonly>
          <div class="lf-hint">Forgot password?</div>
        </div>
        <button class="btn-full">Continue</button>
        <div class="login-footer-m">No account? <a href="#">Create one for free</a></div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
